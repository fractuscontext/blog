relativeURLs: false
canonifyURLs: false
locale: "en-au"
title: "R. Mutt Furnishings"
theme: "floral-cities"

pagination:
  pagerSize: 20

# Replaces the theme's menu (Home / Posts)
menus:
  main:
    - name: Home
      pageRef: /
      weight: 10
    - name: Writings
      pageRef: /archive
      weight: 20

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      typographer:
        disable: true
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ["$$", "$$"]
          inline:
            - ['\(', '\)']
            - ["$", "$"]
  highlight:
    noClasses: false

params:
  # The blog section (drives the tags bar on its list page)
  mainSections: ["archive"]
  # Licence card at the end of each post: fallbacks for posts that don't set
  # `author` / `license` in front matter (see themes/floral-cities/layouts/_partials/copyright.html).
  # Set `author:` in each post's front matter (or here, as a fallback).
  license: "CC BY-SA 4.0" # links to its SPDX page; use {name, url} for a custom link
  enableNoJsDarkMode: true
  images:
    - "images/favicon-highres-social.jpg"
  retro_footer:
    separator_image: "images/cat_separator.gif"
    lines:
      - "Except where otherwise noted,"
      - "content on this site is licensed under a <a href='https://creativecommons.org'>CC BY-SA 4.0 license</a>"
      - ""
      - "Questions? See <a href='/about/'>About</a> page"
      - ""
      - "Blog powered by Hugo, <a href='https://github.com/fractuscontext/floral-cities'> floral-cities</a> as the theme."
    badges:
      - image: "https://jigsaw.w3.org/css-validator/images/vcss"
        alt: "Valid CSS!"
        url: "https://jigsaw.w3.org/css-validator/check/referer"
      - image: images/macos_mov.gif
        alt: "Made with Mac"
      - image: images/anythingbut.gif
        alt: "Anything but Chrome"
      - image: images/www2.gif
        alt: "World-wide Web"
      - image: images/pride_flag.gif
        alt: "RAINBOW FLAG"
        url: "https://www.amnesty.org/en/what-we-do/discrimination/lgbti-rights/"
